License: MIT
LicenseUrl: https://github.com/unixwin/niubash/blob/master/LICENSE
ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - $(case ... ) keyword-pattern family parses and runs (comsub body
    is a fresh command stream; backward-looking esac rule)
  - posix round-trip: set -o posix arms inherit_errexit (sticky on
    set +o posix) exactly like GNU
  - Hard-killed pipeline lingerers report the SIGPIPE shape (141)
  - Fatal expansion inside $( ) under -c reports 1, not 127
  - Foreign Git Bash PS1 (with __git_ps1) discarded before rc
ReleaseNotesUrl: https://github.com/unixwin/niubash/releases/tag/v1.2.5
