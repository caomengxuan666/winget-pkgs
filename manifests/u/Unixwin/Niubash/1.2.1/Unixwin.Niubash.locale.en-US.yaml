ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - WinGet packaging: Inno Setup installer replaces the portable zip (the
    portable shim dropped the bundled WinuxCmd command tree, so niu aborted
    with STATUS_DLL_NOT_FOUND — see niubash#150)
  - History provider never aborts startup; GNU startup-file coverage
  - HOME-family environment export boundary pinned
