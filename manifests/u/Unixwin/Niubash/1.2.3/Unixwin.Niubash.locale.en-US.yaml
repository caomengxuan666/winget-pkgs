ReleaseNotes: |-
  - External-pipeline data loss fixed (P0): the broken-pipe hard-kill
    window now arms only after the downstream member exits
  - $() children see pre-opened fds 3/4 (nvm-exec protocol)
  - ${assoc[*]@A} keeps the assignment body; case-pattern keywords
    stay inert
