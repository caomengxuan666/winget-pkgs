ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - Fixed interactive arithmetic corruption: aliases no longer expand
    inside compound array assignments (the oh-my-bash OMB_VERSINFO
    "-: arithmetic syntax error" under any theme)
  - Plugin sync state machine: imperative mode is silent at startup,
    `niu plugin sync --adopt` declares installed sources, the wizard
    ends spec-managed, `niu plugin add` adopts installed sources
  - No more re-download loop on failed startup installs; bash-it
    fingerprint matches the real upstream
